ba_budget_before_core_cuts:
  source: ba_budget.csv in this folder (Statistisches Jahrbuch tables 1965-2007, BT-Drs. 19/9668 for 2008-18, BMF Monatsberichte and BT-Drs. 21/7611 for 2020-25)
  1973-75: BA ran deficits from 1974 (-2.4 bn DM from own assets); 1975 needed 7.3 bn DM federal loans/grants (§ 187 AFG) - the year the Zumutbarkeit cut passed; 1976 another 3.0 bn DM; 1977-78 surpluses
    before the 4. AFG-ÄndG passed (Oct 1977).
  1979-83: Deficits from 1979 drained the reserve (3.4 -> 0.4 bn DM by end-1980); federal money 1.84 bn DM in 1980 and, implied, about 8.2 bn DM (1981), 7.0 (1982) and 1.6 (1983) - every core cut of 1981-83
    followed a year of federal deficit cover. The 1986 strike-neutrality cut came with the BA in surplus.
  1991-93: Reserve exhausted in 1992 (4.97 -> 0.07 bn DM); implied federal cover about 8.9 bn DM (1992) and 24.4 bn DM (1993) before/at the SKWPG cut, and 6.9 bn DM (1995) / 13.8 bn DM (1996) before the
    1996 KSchG/sick-pay/pension cuts.
  2001-05: Deficits needing federal money every year 2001-2005 (implied 1.9, 5.6, 6.2, 4.2, 0.4 bn EUR) before the 2002-04 ALG and KSchG cuts; pension cuts (2001, 2004, 2007) concern the pension fund, not
    the BA.
  later: No core cuts in 2007-09, 2011-13, 2017-20 or (so far) 2022-25, although the BA needed federal money in 2010 (one-off grant), 2020 (6.9 bn loan, later forgiven), 2021 (16.9 bn grant), 2022 (0.4
    bn loan) and 2025 (1.4 bn loan).

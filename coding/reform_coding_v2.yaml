# Reform coding v2 - see fixed_rules and conventions below. Generated 2026-11-25.
title: German labour-market and social-insurance legislation after economic downturns (coding v2)
compiled: '2026-11-25'
replaces: reform_coding.yaml (used only as a list of leads; every item below was re-checked, nothing copied unverified)
fixed_rules:
  1_episodes: 'Output-gap peak to trough (AMECO), taken as given: 1965-67, 1973-75, 1979-83, 1991-93, 2001-05, 2007-09, 2011-13, 2017-20, 2022-25.'
  2_window: 'A law belongs to an episode if the Bundestag passed it (Gesetzesbeschluss = 2nd/3rd reading, or the 3rd reading where they were on different days) between 1 January of the peak year and 31
    December of the third year after the trough year. Windows: 1965-67 -> 1965-01-01..1970-12-31; 1973-75 -> 1973-01-01..1978-12-31; 1979-83 -> 1979-01-01..1986-12-31; 1991-93 -> 1991-01-01..1996-12-31;
    2001-05 -> 2001-01-01..2008-12-31; 2007-09 -> 2007-01-01..2012-12-31; 2011-13 -> 2011-01-01..2016-12-31; 2017-20 -> 2017-01-01..2023-12-31; 2022-25 -> 2022-01-01..2028-12-31 (i.e. up to today, 2026-11-25).
    Overlaps are assigned to the EARLIER episode: 2007-2008 -> 2001-05; 2011-2012 -> 2007-09; 2022-2023 -> 2017-20. Applied mechanically. Where the Bundestag voted again after a Vermittlungsausschuss or
    overrode a Bundesrat Einspruch, the first Gesetzesbeschluss date is used and the later vote is given in note. Ordinances (only for short-time-work duration) are placed by the date they were issued.
    Laws passed outside all windows are listed under outside_windows.'
  3_scope: Enacted federal laws (and ordinances only for short-time-work duration) changing (a) dismissal protection (KSchG), (b) level, duration or eligibility of Arbeitslosengeld (and Arbeitslosenhilfe
    until 2004), (c) statutory sick pay, (d) statutory pension level/formula for current contributors, (e) short-time work, (f) fixed-term, agency or marginal employment, (g) basic income support / social
    assistance for the unemployed (Sozialhilfe, ALG II, Buergergeld, Grundsicherung), (h) active labour-market policy funding. Pure tax, fiscal-rule and immigration laws are excluded (listed under excluded_by_scope).
    Pending bills go to pending.
  4_fields: id, episode, law (official, short), bundestag_passed, bgbl, in_force, area (a-h), what, direction (cut|expansion|buffer|deregulation), target (core|margin), source_text, source_url, source_type,
    confirmed, note. core = KSchG, ALG level/duration/eligibility, sick pay, pension level/formula, short-time work. margin = fixed-term/agency/marginal work, Arbeitslosenhilfe/social assistance/ALG II/Buergergeld/Grundsicherung,
    ALMP for the unemployed, new entrants.
  5_episode_summary: Each episode carries core_cut (yes/no) and one sentence.
conventions:
  source_type: primary = Bundestag Drucksache, Plenarprotokoll, GESTA Gesetzesmaterialien of the Bundestag Parlamentsarchiv (dserver.bundestag.de/gm/...), BGBl, bundestag.de text archive / hib, or an official
    agency publication (BMF Monatsbericht, Statistisches Bundesamt). secondary = IAB chronicle compilations (doku.iab.de/chronik, which reproduce ministry/BA press texts or an IG Metall seminar paper),
    academic or press. source_type describes the source of the MAIN NUMBER; the passage date is always from a primary Bundestag source unless the note says otherwise.
  confirmed: true only if the passage date AND the main number in `what` were seen in the cited source(s). Everything else in `what` that was not seen is flagged in note.
  source_url: list; first entry = source of the date (GESTA or Plenarprotokoll), further entries = source of the content.
  access_notes: dip.bundestag.de (JavaScript only), bgbl.de, gesetze-im-internet.de, arbeitsagentur.de, bmas.de, dejure.org and buzer.de were not reachable; dserver.bundestag.de (Drucksachen, Plenarprotokolle,
    GESTA files for WP 8-19), doku.iab.de, bundestag.de, recht.bund.de, bundesfinanzministerium.de and statistischebibliothek.de were. Statutory text after 2023 checked on recht.bund.de where possible.

  - id: E1-01
    law:
      official: Arbeitsförderungsgesetz
      short: AFG
    bundestag_passed: '1969-05-13'
    bgbl: BGBl. I 1969 S. 582 (law of 25 June 1969)
    in_force: July 1969 (IAB chronicle)
    area: h
    what: Replaced the 1927 unemployment-insurance law with the AFG, created a legal entitlement to further training and retraining support, and from October 1969 raised the training allowance (Unterhaltsgeld)
      from 75% to 81.25% of net pay for the first six months and 87.5% thereafter.
    direction: expansion
    target: margin
    source_text: 'PlPr 5/234 (13 May 1969): "Wer dem Arbeitsförderungsgesetz im ganzen zustimmen will, möge sich erheben ... Ich stelle einstimmige Annahme des Gesetzes fest." / IAB: "Der Hauptbetrag des
      Uhg bei Maßnahmen zur beruflichen Fortbildung und Umschulung (FuU) wird ab Oktober von 75% ... angehoben auf 81,25% für die ersten sechs Monate und auf 87,5% für die weitere Dauer der Maßnahme."'
    source_url:
    - https://dserver.bundestag.de/btp/05/05234.pdf
    - https://dserver.bundestag.de/btd/10/006/1000690.pdf
    - https://doku.iab.de/chronik/31/1993_06_20_31_Diew.pdf
    source_type: secondary
    confirmed: true
    note: Date primary (PlPr 5/234, unanimous). BGBl citation seen in BT-Drs. 10/690. The 75/81.25/87.5% figures come from the IAB chronicle (based on J. Steffen 1993), not from the statute. Target margin
      because the main expansion is ALMP/training; the AFG also re-enacted ALG and Kurzarbeitergeld rules, which are not coded as a change here.
    episode: 1965-67

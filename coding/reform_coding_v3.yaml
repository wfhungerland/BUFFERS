# Reform coding v3 - cycle-blind year-by-year sweep 1965-2026. See reform_coding_v3_protocol.md.
title: 'German federal labour-market and social-insurance legislation 1965-2026: year-by-year coding v3 (cycle-blind)'
compiled: '2026-11-27'
protocol_note: reform_coding_v3_protocol.md (same folder)
design: 'Fixed protocol, blind to the business cycle: no unemployment, output or recession data were looked up or used, and no years were prioritised. Every year 1965-2026 was screened with the same automated
  frame and the same keyword and committee filter; candidates were then coded from the same two document types (Bundestag passage record and the bill Drucksache). Items are not assigned to episodes and
  are not coded core/margin.'
scope:
  a: dismissal protection incl. group-specific rules
  b: unemployment insurance benefit level, duration, eligibility, sanctions
  c: statutory sick pay
  d: statutory old-age pensions for current contributors (level, formula, retirement age)
  e: short-time work (incl. Schlechtwettergeld/Winterausfallgeld/Saison-Kug)
  f: fixed-term, agency, marginal/mini-jobs
  g: minimum income support for the unemployed (Arbeitslosenhilfe, Sozialhilfe for employables, ALG II, Bürgergeld, Grundsicherung)
  h: active labour-market policy funding and instruments
  i: minimum wage (statutory and sectoral via AEntG/MiArbG)
  j: codetermination / works constitution
fields:
  id: v3-<year of Bundestag passage>-<running number>
  bundestag_passed: date of the final (third) reading, or combined 2nd/3rd reading; first Gesetzesbeschluss if a Vermittlungsausschuss or Einspruch followed
  direction: cut | expansion | mixed | deregulation | re-regulation (from the point of view of the benefit recipient or protected employee)
  size: 1 minor/technical, 2 moderate, 3 major (large group, level/duration/protection substantially changed)
  motive_stated: category from the bill (A. Problem/Zielsetzung or Begründung) or the government statement at passage; quote and Drucksache given; "not seen" where not read
  source_type: primary = Bundestag Drucksache/Plenarprotokoll/GESTA; secondary = IAB chronicle (doku.iab.de) for the main number
  confirmed: true only if the passage date AND the main content in what were seen in the cited source(s); content from a bill is treated as seen even if committee amendments were not compared, unless the
    note says the final text differs
  in_v2: item corresponds to an item of reform_coding_v2.yaml (episodes or outside_windows)
  found_via_v2_check: item was missed by the sweep and only added when the finished sweep was checked against v2
  frame_ref: record in the sampling frame (GESTA number or plenary-protocol session)
counts:

excluded_by_scope:
  rule_routine_pension_adjustment: 'Annual pension adjustment laws that only apply the existing formula are excluded; those departing from it are coded. Screened and excluded as routine: 8. RAG 1965 (PlPr
    5/12, Drs. V/20), 9. RAG 1966 (V/1001), 10. RAG 1967 (V/2182), 11. RAG 1968 (V/3335), 13. RAG 1970 (VI/640), 14. RAG 1971 (VI/2199), 16. RAG 1973 (7/427; changed future adjustment rules, not read further),
    17. RAG 1974 (7/1483), 18. RAG 1975 (7/3065), 19. RAG 1976 (7/4722), RVRAG 1982 (GESTA IX/31), RV/UVRAG 1984-1991 (GESTA X/38, X/134, X/222, X/291, XI/50, XI/121, XI/243, XII/5). The 1977 and 1978 laws
    (20./21. RAG) and 2006, 2008, 2022 laws depart from the formula and are coded.'
  rule_disability_survivor_pensions: 'Disability and survivor pension laws excluded (scope d = old-age pensions of contributors): GESTA XIII/57, XIII/100, XIV/182, XIV/255, XVIII/494; Mütterrente/Kindererziehung
    for current pensioners (GESTA XI/3).'
  rule_financing_only: 'Laws changing only contribution rates, federal subsidies or reserves are excluded: GESTA XII/2 (1991), XIII/325 (1997), XVI/48 (HBeglG 2006, UI contribution 6.5 to 4.5%), XVI/288
    (2007, UI 4.2 to 3.9%), XVI/415 (2008, UI to 3.0%), XVII/4 (2010), XVII/344, XVII/366 (HBeglG 2013, end of federal share in BA costs), XVIII/7, XV/99 (HBeglG 2004), XII/11 (HBeglG 1991), XV/5 (Beitragssatzsicherungsgesetz
    2002, not read further), PlPr 19/69 (2018 UI contribution cut), PlPr 20/63 RV-Mindestrücklagengesetz, PlPr 21/25 HBeglG 2025 (fiscal rules). The 1965 Haushaltssicherungsgesetz (V/58, miners pension
    subsidy) and the 1967 Finanzänderungsgesetz (V/2149, pensioners health contribution of 4%) are excluded on the same ground (pensioners, financing).'
  rule_administration: 'Organisational and federal-municipal finance laws excluded: GESTA XIII/316 (1. SGB III-ÄndG, misuse control), XV/188 (Optionsgesetz), XV/229, XVII/32, XVI/1, XVI/278, XVI/347, XVI/414,
    XVII/78, XVII/109 (federal share in SGB II housing costs), XVIII/29.'
  rule_other_systems: 'SGB XII-only (non-employable) laws excluded: GESTA XVI/90, XVII/367, XVII/534, XIII/188, X/140, X/261, XI/321, XII/97. Unification transition (Renten-Überleitungsgesetz, GESTA XII/19)
    excluded. Tax-only laws excluded (GESTA IX/73 BeschäftFG 1982, PlPr 7/139 Investitionen und Beschäftigung 1974, PlPr 21/48 Aktivrentengesetz). Part-time-only law (GESTA XIX/37 Brückenteilzeit 2018),
    tenancy (XIII/80), working time (XII/343), Nachweisrichtlinie 2022 (PlPr 20/44), drivers posting (PlPr 20/109), Tariftreuegesetz (PlPr 21/59), occupational and private pensions (Betriebsrentenstärkung,
    Frühstartrente, Altersvorsorgereform), migrant labour-market access (GESTA XV/134, XIX/106, XIX/108) excluded.'
  rule_opposition_bills: Bills of opposition groups reaching second reading are not coded unless adoption was seen (e.g. PlPr 19/233 TzBfG and Minijob-Dynamisierung bills, PlPr 19/236 Massenentlassungsverbot).
